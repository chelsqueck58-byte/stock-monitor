<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Monitor</title>
</head>
<body>
<div id="app"></div>
<script>
// Load fresh HTML content from raw GitHub, bypassing Fastly cache
async function loadContent() {
  try {
    const branch = window.location.pathname.includes('stock-monitor-final') ? 'main' : 'production';
    const repo = window.location.pathname.includes('stock-monitor-final') ? 'stock-monitor-final' : 'stock-monitor';
    const url = `https://raw.githubusercontent.com/chelsqueck58-byte/${repo}/${branch}/site/index.html?t=${Date.now()}`;

    const response = await fetch(url);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const html = await response.text();

    // Extract and inject just the body content to preserve script execution
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');

    // Copy everything from fetched doc to current doc
    document.documentElement.innerHTML = doc.documentElement.innerHTML;
  } catch (error) {
    document.body.innerHTML = `<div style="padding:20px;color:red;font-family:monospace;white-space:pre-wrap;">Error: ${error.message}\n\nTrying to load from:\nhttps://raw.githubusercontent.com/chelsqueck58-byte/stock-monitor-final/main/index.html</div>`;
  }
}

loadContent();
</script>
</body>
</html>
