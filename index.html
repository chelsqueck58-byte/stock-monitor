<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading...</title>
<script>
// Load fresh content from raw GitHub, bypassing Fastly cache
async function loadContent() {
  try {
    const branch = window.location.pathname.includes('stock-monitor-final') ? 'main' : 'production';
    const repo = window.location.pathname.includes('stock-monitor-final') ? 'stock-monitor-final' : 'stock-monitor';
    const url = `https://raw.githubusercontent.com/chelsqueck58-byte/${repo}/${branch}/index.html?t=${Date.now()}`;

    const response = await fetch(url);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const html = await response.text();

    // Replace entire document with fetched content
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    document.body.innerHTML = `<div style="padding:20px;color:red;font-family:monospace;">Error loading content: ${error.message}</div>`;
  }
}

loadContent();
</script>
</head>
<body>
<div style="padding:20px;font-family:monospace;color:#666;">Loading fresh content...</div>
</body>
</html>
