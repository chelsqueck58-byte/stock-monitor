<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stock-monitor</title>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --border:#21262d; --text:#e6edf3;
    --muted:#7d8590; --up:#26a641; --down:#f85149; --accent:#58a6ff;
    --sup:#26a641; --res:#f85149;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  header { padding:12px 16px; border-bottom:1px solid var(--border);
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:15px; font-weight:600; letter-spacing:.3px; }
  header .meta { color:var(--muted); font-size:12px; }
  #stale { display:none; background:var(--down); color:#fff; padding:10px 16px;
    font-weight:600; text-align:center; }
  #stale.show { display:block; }
  nav { display:flex; gap:2px; padding:8px 12px; border-bottom:1px solid var(--border);
    flex-wrap:wrap; position:sticky; top:0; background:var(--bg); z-index:5; }
  nav button { background:transparent; border:1px solid transparent; color:var(--muted);
    padding:6px 12px; border-radius:6px; cursor:pointer; font-size:13px; }
  nav button.active { background:var(--panel); color:var(--text); border-color:var(--border); }
  nav .spacer { flex:1; }
  nav .export { color:var(--accent); border-color:var(--border); }
  main { padding:12px; display:grid; gap:12px;
    grid-template-columns:repeat(auto-fill,minmax(440px,1fr)); }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:8px;
    overflow:hidden; }
  .card .top { display:flex; align-items:baseline; gap:8px; padding:10px 12px;
    border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .card .name { font-weight:600; }
  .card .id { color:var(--muted); font-size:11px; }
  .card .px { margin-left:auto; font-variant-numeric:tabular-nums; font-weight:600; }
  .pct { font-variant-numeric:tabular-nums; padding:1px 5px; border-radius:4px; font-size:11px; }
  .pct.u { color:var(--up); } .pct.d { color:var(--down); }
  .mas { display:flex; gap:5px; padding:6px 12px; flex-wrap:wrap;
    border-bottom:1px solid var(--border); }
  .ma { font-size:10px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .ma b { color:var(--text); font-weight:600; }
  .ma.above b { color:var(--up); } .ma.below b { color:var(--down); }
  .chart { height:220px; }
  .note { width:100%; border:none; border-top:1px solid var(--border); background:transparent;
    color:var(--text); padding:8px 12px; resize:vertical; min-height:44px; font:inherit; }
  .note::placeholder { color:var(--muted); }
  .flags { padding:4px 12px; font-size:11px; color:var(--muted); }
  .flags b.res { color:var(--res); } .flags b.sup { color:var(--sup); }
</style>
</head>
<body>
<div id="stale"></div>
<header>
  <h1>stock-monitor</h1>
  <span class="meta" id="meta">loading…</span>
</header>
<nav id="tabs"></nav>
<main id="grid"></main>

<script src="./vendor/lightweight-charts.standalone.production.js"></script>
<script>
"use strict";
const MA_PERIODS = [20, 50, 100, 200];
const MA_COLORS = { 20:"#58a6ff", 50:"#d29922", 100:"#bc8cff", 200:"#7d8590" };
let DATA = null, STALE = false, ACTIVE = null;

function sma(closes, period) {
  const out = [];
  let sum = 0;
  for (let i = 0; i < closes.length; i++) {
    sum += closes[i];
    if (i >= period) sum -= closes[i - period];
    out.push(i >= period - 1 ? sum / period : null);
  }
  return out;
}

function fmtPct(v) {
  if (v === null || v === undefined) return "–";
  const cls = v >= 0 ? "u" : "d";
  return `<span class="pct ${cls}">${v >= 0 ? "+" : ""}${v.toFixed(2)}%</span>`;
}

function checkStale(payload) {
  const gen = new Date(payload.generated_at).getTime();
  const ageH = (Date.now() - gen) / 3.6e6;
  const limit = payload.stale_after_hours || 30;
  const banner = document.getElementById("stale");
  if (ageH > limit) {
    banner.textContent =
      `⚠ DATA STALE — generated ${ageH.toFixed(1)}h ago (limit ${limit}h). ` +
      `Levels are hidden; do not trade off this page until it refreshes.`;
    banner.classList.add("show");
    return true;
  }
  return false;
}

function buildTabs() {
  const groups = [...new Set(DATA.instruments.map(i => i.group))];
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  groups.forEach((g, idx) => {
    const b = document.createElement("button");
    b.textContent = g;
    if (idx === 0) { b.classList.add("active"); ACTIVE = g; }
    b.onclick = () => {
      [...nav.querySelectorAll("button")].forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      ACTIVE = g;
      renderGroup();
    };
    nav.appendChild(b);
  });
  const spacer = document.createElement("span");
  spacer.className = "spacer";
  nav.appendChild(spacer);
  const exp = document.createElement("button");
  exp.className = "export";
  exp.textContent = "⤓ export notes";
  exp.onclick = exportNotes;
  nav.appendChild(exp);
}

function noteKey(id) { return `stockmon.note.${id}`; }

function exportNotes() {
  const notes = {};
  DATA.instruments.forEach(i => {
    const v = localStorage.getItem(noteKey(i.id));
    if (v) notes[i.id] = v;
  });
  const blob = new Blob([JSON.stringify(notes, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "stock-monitor-notes.json";
  a.click();
  URL.revokeObjectURL(a.href);
}

function drawChart(el, inst) {
  const chart = LightweightCharts.createChart(el, {
    layout: { background: { color: "transparent" }, textColor: "#7d8590" },
    grid: { vertLines: { color: "#21262d" }, horzLines: { color: "#21262d" } },
    rightPriceScale: { borderColor: "#21262d" },
    timeScale: { borderColor: "#21262d", timeVisible: false },
    crosshair: { mode: 0 },
    height: 220,
  });
  const candle = chart.addCandlestickSeries({
    upColor: "#26a641", downColor: "#f85149", borderVisible: false,
    wickUpColor: "#26a641", wickDownColor: "#f85149",
  });
  candle.setData(inst.bars.map(b => ({ time: b.d, open: b.o, high: b.h, low: b.l, close: b.c })));

  const closes = inst.bars.map(b => b.c);
  MA_PERIODS.forEach(p => {
    if (inst.bars.length < p) return;
    const series = sma(closes, p);
    const line = chart.addLineSeries({ color: MA_COLORS[p], lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
    line.setData(inst.bars.map((b, i) => ({ time: b.d, value: series[i] })).filter(x => x.value !== null));
  });

  // Support/resistance zones — suppressed when data is stale (levels untrustworthy).
  if (!STALE && inst.levels) {
    for (const win of ["3m", "1m"]) {
      const lv = inst.levels[win];
      if (!lv) continue;
      const style = win === "1m" ? LightweightCharts.LineStyle.Dotted : LightweightCharts.LineStyle.Dashed;
      (lv.support || []).forEach(s => candle.createPriceLine({
        price: s.price, color: "#26a641", lineWidth: 1, lineStyle: style,
        axisLabelVisible: true, title: `S ${win}`,
      }));
      (lv.resistance || []).forEach(r => candle.createPriceLine({
        price: r.price, color: "#f85149", lineWidth: 1, lineStyle: style,
        axisLabelVisible: true, title: `R ${win}`,
      }));
    }
  }
  chart.timeScale().fitContent();
  return chart;
}

function card(inst) {
  const el = document.createElement("div");
  el.className = "card";

  const mas = MA_PERIODS.map(p => {
    const vs = inst.vs_ma ? inst.vs_ma[p] : null;
    if (vs === null || vs === undefined) return `<span class="ma">${p}: –</span>`;
    const dir = vs >= 0 ? "above" : "below";
    return `<span class="ma ${dir}">${p} <b>${vs >= 0 ? "+" : ""}${vs.toFixed(1)}%</b></span>`;
  }).join("");

  let flagsHtml = "";
  if (!STALE && inst.flags && inst.flags.length) {
    flagsHtml = '<div class="flags">near: ' + inst.flags.map(f => {
      const kind = f.kind === "support" ? "sup" : "res";
      return `<b class="${kind}">${f.kind[0].toUpperCase()}</b> ${f.price.toLocaleString(undefined,{maximumFractionDigits:2})} (${f.window} ${f.distance_pct>=0?"+":""}${f.distance_pct.toFixed(1)}%)`;
    }).join(" · ") + "</div>";
  }

  el.innerHTML = `
    <div class="top">
      <span class="name">${inst.label}</span>
      <span class="id">${inst.id} · ${inst.currency || ""}</span>
      <span class="px">${inst.last_close.toLocaleString(undefined,{maximumFractionDigits:2})}</span>
      ${fmtPct(inst.change_pct)} ${fmtPct(inst.ytd_pct)}
    </div>
    <div class="mas">${mas}</div>
    ${flagsHtml}
    <div class="chart"></div>
    <textarea class="note" placeholder="notes — ${inst.id} (saved on this device)"></textarea>`;

  const ta = el.querySelector(".note");
  ta.value = localStorage.getItem(noteKey(inst.id)) || "";
  ta.addEventListener("input", () => localStorage.setItem(noteKey(inst.id), ta.value));

  requestAnimationFrame(() => drawChart(el.querySelector(".chart"), inst));
  return el;
}

function renderGroup() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  DATA.instruments.filter(i => i.group === ACTIVE).forEach(i => grid.appendChild(card(i)));
}

async function load() {
  try {
    const res = await fetch("./data.json", { cache: "no-store" });
    if (!res.ok) throw new Error(`data.json HTTP ${res.status}`);
    DATA = await res.json();
  } catch (err) {
    document.getElementById("meta").textContent = `failed to load data.json: ${err.message}`;
    return;
  }
  STALE = checkStale(DATA);
  const gen = new Date(DATA.generated_at);
  const fails = DATA.failures && DATA.failures.length ? ` · ${DATA.failures.length} failed` : "";
  document.getElementById("meta").textContent =
    `${DATA.instruments.length} instruments · ${DATA.source} · generated ${gen.toLocaleString()}${fails}`;
  buildTabs();
  renderGroup();
}

load();
</script>
</body>
</html>
