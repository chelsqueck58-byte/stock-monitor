<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stock-monitor</title>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --border:#21262d; --text:#e6edf3;
    --muted:#7d8590; --up:#26a641; --down:#f85149;
    --ema:#e3b341; --sma:#58a6ff; --vwap:#bc8cff;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  header { padding:10px 16px; border-bottom:1px solid var(--border); position:sticky; top:0;
    background:var(--bg); z-index:5; }
  header h1 { margin:0 0 3px; font-size:15px; font-weight:600; letter-spacing:.3px; display:inline; }
  header .meta { color:var(--muted); font-size:12px; margin-left:10px; }
  header .legend { color:var(--muted); font-size:11px; display:block; margin-top:4px; }
  header .legend b.ema { color:var(--ema); } header .legend b.sma { color:var(--sma); }
  header .legend b.vwap { color:var(--vwap); }
  #stale { display:none; background:var(--down); color:#fff; padding:10px 16px; font-weight:600; text-align:center; }
  #stale.show { display:block; }
  main { padding:12px; display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(460px,1fr)); }
  .section { grid-column:1/-1; font-size:12px; font-weight:600; color:var(--muted);
    text-transform:uppercase; letter-spacing:.5px; padding:8px 2px 2px; border-bottom:1px solid var(--border); }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .card.setup { border-color:var(--ema); box-shadow:inset 0 0 0 1px var(--ema); }
  .card .top { display:flex; align-items:center; gap:6px; padding:8px 10px; flex-wrap:wrap; }
  .card .name { font-weight:600; }
  .card .id { color:var(--muted); font-size:11px; }
  .card .px { margin-left:auto; font-variant-numeric:tabular-nums; font-weight:600; }
  .pct { font-variant-numeric:tabular-nums; font-size:11px; }
  .pct.u { color:var(--up); } .pct.d { color:var(--down); }
  .badge { font-size:10px; font-weight:600; padding:1px 5px; border-radius:4px; white-space:nowrap; }
  .badge.up { color:var(--up); background:rgba(38,166,65,.14); }
  .badge.down { color:var(--down); background:rgba(248,81,73,.14); }
  .badge.flat { color:var(--muted); background:rgba(125,133,144,.14); }
  .badge.entry { color:var(--ema); background:rgba(227,179,65,.16); }
  .badge.cta-long { color:var(--up); background:rgba(38,166,65,.10); }
  .badge.cta-short { color:var(--down); background:rgba(248,81,73,.10); }
  .remark { padding:5px 10px; font-size:11px; border-bottom:1px solid var(--border);
    font-variant-numeric:tabular-nums; }
  .remark.enter { color:var(--up); }
  .remark.exit { color:var(--down); }
  .remark.muted { color:var(--muted); }
  .chart { height:300px; }
  .note { width:100%; border:none; border-top:1px solid var(--border); background:transparent;
    color:var(--text); padding:6px 10px; resize:vertical; min-height:32px; font:inherit; font-size:12px; }
  .note::placeholder { color:var(--muted); }
</style>
</head>
<body>
<div id="stale"></div>
<header>
  <h1>stock-monitor</h1><span class="meta" id="meta">loading…</span>
  <span class="legend">
    <b class="ema">21EMA</b> · <b class="sma">50SMA</b> · <b class="vwap">VWAP</b> · S/R lines ·
    ⚡ pullback entry · CTA↑ = 20-day breakout · top line = enter/exit cue · chart = late-Apr → now
  </span>
</header>
<main id="grid"></main>

<script src="./vendor/lightweight-charts.standalone.production.js"></script>
<script>
"use strict";
const TREND_ORDER = { up: 0, flat: 1, down: 2 };
let DATA = null, STALE = false, OBSERVER = null;

function emaSeries(closes, period) {
  const out = []; const k = 2 / (period + 1); let e = null;
  for (let i = 0; i < closes.length; i++) {
    if (i < period - 1) { out.push(null); continue; }
    if (e === null) { let s = 0; for (let j = i - period + 1; j <= i; j++) s += closes[j]; e = s / period; }
    else { e = closes[i] * k + e * (1 - k); }
    out.push(e);
  }
  return out;
}
function smaSeries(closes, period) {
  const out = []; let sum = 0;
  for (let i = 0; i < closes.length; i++) {
    sum += closes[i]; if (i >= period) sum -= closes[i - period];
    out.push(i >= period - 1 ? sum / period : null);
  }
  return out;
}
function avwapSeries(bars) {
  const N = Math.min(63, bars.length); const start = bars.length - N;
  let anchor = start, lo = Infinity;
  for (let i = start; i < bars.length; i++) if (bars[i].l < lo) { lo = bars[i].l; anchor = i; }
  let pv = 0, vv = 0; const out = [];
  for (let i = 0; i < bars.length; i++) {
    if (i < anchor) { out.push(null); continue; }
    const v = bars[i].v || 0; const tp = (bars[i].h + bars[i].l + bars[i].c) / 3;
    pv += tp * v; vv += v; out.push(vv ? pv / vv : null);
  }
  return out;
}
function fmtPct(v) {
  if (v === null || v === undefined) return "";
  return `<span class="pct ${v >= 0 ? "u" : "d"}">${v >= 0 ? "+" : ""}${v.toFixed(2)}%</span>`;
}
function checkStale(p) {
  const ageH = (Date.now() - new Date(p.generated_at).getTime()) / 3.6e6;
  const limit = p.stale_after_hours || 30;
  const b = document.getElementById("stale");
  if (ageH > limit) {
    b.textContent = `⚠ DATA STALE — ${ageH.toFixed(1)}h old (limit ${limit}h). Levels hidden; don't trade off this until it refreshes.`;
    b.classList.add("show"); return true;
  }
  return false;
}
function noteKey(id) { return `stockmon.note.${id}`; }

function latestVwap(bars) {
  const s = avwapSeries(bars);
  for (let i = s.length - 1; i >= 0; i--) if (s[i] != null) return s[i];
  return null;
}

// Actionable proximity remark: what key line/level price is sitting on, + enter/exit cue.
function keyRemark(inst) {
  const last = inst.last_close, items = [];
  const add = (label, ref, kind) => {
    if (!ref) return;
    const d = (last / ref - 1) * 100;
    if (Math.abs(d) <= 2) items.push({ label: `${label} ${d >= 0 ? "+" : ""}${d.toFixed(1)}%`, kind });
  };
  add("21EMA", inst.ema21, "ema");
  add("50SMA", inst.sma50, "ma");
  add("VWAP", latestVwap(inst.bars), "vwap");
  (inst.flags || []).forEach(f => items.push({
    label: `${f.kind === "support" ? "Sup" : "Res"} ${f.price.toLocaleString(undefined, { maximumFractionDigits: 1 })} ${f.distance_pct >= 0 ? "+" : ""}${f.distance_pct.toFixed(1)}%`,
    kind: f.kind,
  }));
  if (!items.length) return { html: "— no key level nearby", cls: "muted" };

  const nearRes = items.some(i => i.kind === "resistance");
  const nearSup = items.some(i => i.kind === "support");
  const nearEma = items.some(i => i.kind === "ema" || i.kind === "vwap");
  let tag = "", cls = "muted";
  if (inst.entry_setup) { tag = "⚡ ENTER"; cls = "enter"; }
  else if (nearRes && inst.trend !== "up") { tag = "⚠ EXIT — at resistance"; cls = "exit"; }
  else if ((nearSup || nearEma) && inst.trend === "up") { tag = "ENTER watch"; cls = "enter"; }
  else if (nearEma && inst.trend === "down") { tag = "⚠ break watch"; cls = "exit"; }
  else if (nearRes) { tag = "⚠ resistance"; cls = "exit"; }
  return { html: (tag ? `<b>${tag}</b> — ` : "") + items.map(i => i.label).join(" · "), cls };
}

function badges(inst) {
  const t = inst.trend || "flat";
  const tl = t === "up" ? "▲" : t === "down" ? "▼" : "–";
  const entry = inst.entry_setup ? `<span class="badge entry" title="pullback to 21EMA in uptrend">⚡ ENTRY</span>` : "";
  let cta = "";
  if (inst.cta === "long") cta = `<span class="badge cta-long" title="20-day breakout up">CTA↑</span>`;
  else if (inst.cta === "short") cta = `<span class="badge cta-short" title="20-day breakdown">CTA↓</span>`;
  return `<span class="badge ${t}" title="trend vs 21EMA">${tl}</span>${entry}${cta}`;
}

function drawChart(el, inst) {
  const chart = LightweightCharts.createChart(el, {
    layout: { background: { color: "transparent" }, textColor: "#7d8590", fontSize: 10 },
    grid: { vertLines: { color: "#1b2027" }, horzLines: { color: "#1b2027" } },
    rightPriceScale: { borderColor: "#21262d" },
    timeScale: { borderColor: "#21262d", timeVisible: false },
    crosshair: { mode: 0 }, height: 300,
  });
  // Clean filled-area price line (no candles, no in-plot number labels).
  const area = chart.addAreaSeries({
    lineColor: "#f0648b", lineWidth: 2,
    topColor: "rgba(240,100,139,.28)", bottomColor: "rgba(240,100,139,.02)",
    priceLineVisible: true, lastValueVisible: true,
  });
  area.setData(inst.bars.map(b => ({ time: b.d, value: b.c })));

  const closes = inst.bars.map(b => b.c);
  const overlays = [
    ["#e3b341", emaSeries(closes, 21)],   // 21 EMA
    ["#58a6ff", smaSeries(closes, 50)],   // 50 SMA
    ["#bc8cff", avwapSeries(inst.bars)],  // anchored VWAP
  ];
  for (const [color, series] of overlays) {
    const line = chart.addLineSeries({ color, lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
    line.setData(inst.bars.map((b, i) => ({ time: b.d, value: series[i] })).filter(x => x.value != null));
  }
  // S/R as subtle lines, no axis numbers (keep the chart uncluttered).
  if (!STALE && inst.levels && inst.levels["3m"]) {
    const lv = inst.levels["3m"];
    (lv.support || []).forEach(s => area.createPriceLine({ price: s.price, color: "rgba(38,166,65,.5)", lineWidth: 1, lineStyle: 2, axisLabelVisible: false }));
    (lv.resistance || []).forEach(r => area.createPriceLine({ price: r.price, color: "rgba(248,81,73,.5)", lineWidth: 1, lineStyle: 2, axisLabelVisible: false }));
  }
  // Default view: end-April of the latest bar's year -> today.
  const lastDate = inst.bars[inst.bars.length - 1].d;
  try { chart.timeScale().setVisibleRange({ from: `${lastDate.slice(0, 4)}-04-30`, to: lastDate }); }
  catch (e) { chart.timeScale().fitContent(); }
}

function card(inst) {
  const el = document.createElement("div");
  el.className = "card" + (inst.entry_setup ? " setup" : "");
  const rem = keyRemark(inst);
  el.innerHTML = `
    <div class="top">
      <span class="name">${inst.label}</span>
      <span class="id">${inst.id}</span>
      ${badges(inst)}
      <span class="px">${inst.last_close.toLocaleString(undefined, { maximumFractionDigits: 2 })}</span>
      ${fmtPct(inst.change_pct)} ${fmtPct(inst.ytd_pct)}
    </div>
    <div class="remark ${rem.cls}">${rem.html}</div>
    <div class="chart" data-pending="1"></div>
    <textarea class="note" placeholder="notes — ${inst.id}"></textarea>`;
  const ta = el.querySelector(".note");
  ta.value = localStorage.getItem(noteKey(inst.id)) || "";
  ta.addEventListener("input", () => localStorage.setItem(noteKey(inst.id), ta.value));
  el.querySelector(".chart")._inst = inst;
  return el;
}

function sortFn(a, b) {
  if (!!b.entry_setup !== !!a.entry_setup) return (b.entry_setup ? 1 : 0) - (a.entry_setup ? 1 : 0);
  return (TREND_ORDER[a.trend] ?? 3) - (TREND_ORDER[b.trend] ?? 3);
}

function render() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  const groups = [...new Set(DATA.instruments.map(i => i.group))];
  for (const g of groups) {
    const h = document.createElement("div"); h.className = "section"; h.textContent = g;
    grid.appendChild(h);
    DATA.instruments.filter(i => i.group === g).sort(sortFn).forEach(i => grid.appendChild(card(i)));
  }
  // Lazy-render charts as cards scroll into view (59 charts at once is heavy).
  OBSERVER = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (e.isIntersecting && e.target.dataset.pending) {
        delete e.target.dataset.pending;
        drawChart(e.target, e.target._inst);
        OBSERVER.unobserve(e.target);
      }
    }
  }, { rootMargin: "200px" });
  document.querySelectorAll(".chart").forEach(c => OBSERVER.observe(c));
}

async function load() {
  try {
    const res = await fetch("./data.json", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    DATA = await res.json();
  } catch (err) {
    document.getElementById("meta").textContent = `failed to load data.json: ${err.message}`;
    return;
  }
  STALE = checkStale(DATA);
  const setups = DATA.instruments.filter(i => i.entry_setup).length;
  document.getElementById("meta").textContent =
    `${DATA.instruments.length} names · ${setups} entry setups · ${DATA.source} · ${new Date(DATA.generated_at).toLocaleString()}`;
  render();
}
load();
</script>
</body>
</html>
